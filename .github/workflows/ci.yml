name: Validate client
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:web
        env:
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: pedeae-web-preview
          path: dist
          retention-days: 7
